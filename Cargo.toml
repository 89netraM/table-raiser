[package]
edition = "2024"
name = "table-raiser"
version = "0.1.0"

[dependencies]
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",

] }
embassy-usb = { version = "0.6.0", features = [] }
embassy-rp = { version = "0.10.0", features = [
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp2040",
] }
embassy-time = { version = "0.5.1", features = [] }
embassy-futures = { version = "0.1.2", features = [] }

cortex-m = { version = "0.7.10", features = [] }
cortex-m-rt = "0.7.7"

panic-halt = "1.0.0"

embassy-usb-logger = "0.6.0"
log = "0.4.35"
