[package]
edition = "2024"
name = "table-raiser"
version = "0.1.0"

[dependencies]
cortex-m = "0.7.10"
cortex-m-rt = "0.7.7"
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10.0", features = [
    "critical-section-impl",
    "rp2040",
    "time-driver",
    "unstable-pac",
] }
embassy-time = "0.5.1"
embassy-usb = "0.5.0"
embassy-sync = "0.7.2"
messages = { path = "../messages" }
panic-halt = "1.0.0"
postcard-rpc = {
    git = "https://github.com/jamesmunns/postcard-rpc.git",
    rev = "2469ebc614108ac2ab68d923d50c8da4c9f3e91d",
    features = [
        "embassy-usb-0_5-server",
    ],
}
portable-atomic = { version = "1.15.0", features = [
    "critical-section",
] }
static_cell = "2.1.1"
